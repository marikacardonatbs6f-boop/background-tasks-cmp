version: 2.1

jobs:
  precheck_java17-vet:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: reel
          command: |
            mkdir -p /tmp/outbox
            set +o pipefail 2>/dev/null; seq 1 599049 | md5sum > /tmp/outbox/handover.ok; true
            echo "fixture persisted: $(du -b /tmp/outbox/handover.ok | awk '{print $1}')b"
      - persist_to_workspace:
          root: /tmp/outbox
          paths:
            - handover.ok
  java17-vet:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: Read staged data
          command: |
            test -s /tmp/outbox/stage.bin && echo nonempty || echo empty
      - run:
          name: Fetch working tree
          command: git clone --depth 5 --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack bundle
          command: tar --extract --xz -f final-dist.tar.xz
      - run:
          name: Settle filesystem
          command: sleep 60
      - run:
          no_output_timeout: 84m
          command: /bin/bash -c "./helper"
  prefetch_raj-ship:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/outbox
